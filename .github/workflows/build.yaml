name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Export version
        id: version
        run: |
          version=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: mukunku/tag-exists-action@5c39604fe8aef7e65acb6fbcf96ec580f7680313 # v1.7.0
        if: github.event_name == 'push'
        id: check-tag
        with:
          tag: ${{ steps.version.outputs.version }}

  build-sdist:
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    needs: check-version
    outputs:
      file: ${{ steps.build.outputs.file }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        id: build
        run: |
          pip install build
          python -P -m build --sdist
          echo "file=$(basename dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-zexpr-sdist
          path: dist/*.tar.gz

  build-wheel:
    runs-on: ubuntu-latest
    needs: build-sdist
    strategy:
      matrix:
        target:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - aarch64-macos
          - x86_64-macos
          - x86_64-windows
      fail-fast: false
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: vapoursynth-zexpr-sdist
          path: sdist

      - name: Build wheel (${{ matrix.target }})
        env:
          ZTARGET: ${{ matrix.target }}
        run: |
          pip wheel --no-deps -w dist "sdist/${{ needs.build-sdist.outputs.file }}"

      - uses: actions/upload-artifact@v7
        with:
          name: vapoursynth-zexpr-${{ matrix.target }}
          path: dist/*.whl

  publish-pypi:
    if: github.event_name == 'push' && needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    needs:
      - check-version
      - build-sdist
      - build-wheel
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: vapoursynth-zexpr-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    if: github.event_name == 'push' && needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    needs:
      - check-version
      - publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: vapoursynth-zexpr-*
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          files: dist/*
